name: Lambda Health Check

# Probes every function in lambda-functions/deploy-manifest.json and the
# Vercel app.
#
# This used to be seven hardcoded Lambda URLs maintained by hand. Two things
# were wrong with that on 2026-09-17:
#
#  * It probed `membership-registry-lambda`, an orphan function nothing calls,
#    and never probed MembershipRegistryStack-... which is the one .env.local
#    points production at. The check was green because it asked the wrong
#    function. Names now come from the manifest, so "deployed" implies
#    "monitored" and the two cannot drift apart.
#
#  * Those URLs are AuthType NONE and this repository is public, so the list
#    published seven unauthenticated document-generating endpoints. They are
#    now resolved from AWS at run time instead of living in the source tree.
#
# Resolving URLs needs AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (read-only
# lambda:GetFunctionUrlConfig is enough). Without them the job reports that it
# could not check rather than passing silently.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Check Lambda Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Manifest is honest
        run: python3 scripts/test-lambda-manifest.py

      - name: Configure AWS credentials
        id: creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Probe every deployed Lambda
        if: steps.creds.outcome == 'success'
        run: python3 scripts/check-lambda-health.py

      - name: Is AWS running what main says?
        # Answering is not the same as being current. The membership registry
        # answered happily for weeks while 38 lines behind main. Runs even if
        # the probe failed, because "crashing" and "stale" are different
        # questions and both are worth the answer.
        if: steps.creds.outcome == 'success' && !cancelled()
        run: python3 scripts/check-lambda-drift.py

      - name: SunBiz filing watcher alive
        # The EC2 watcher (i-0764ed6c3bda7a5c2) files paid Florida formations
        # flagged Autofill=Yes. Its systemd unit was silently deleted once
        # before (2026-02-17) and every "automatic" filing since was manual.
        # A dead watcher must page before a client's formation sits unfiled.
        if: steps.creds.outcome == 'success' && !cancelled()
        run: |
          IID=i-0764ed6c3bda7a5c2
          CID=$(aws ssm send-command --instance-ids "$IID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["systemctl is-active autofill-watcher"]' \
            --query 'Command.CommandId' --output text)
          sleep 20
          OUT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query 'StandardOutputContent' --output text | tr -d '[:space:]')
          echo "autofill-watcher is-active: $OUT"
          if [ "$OUT" != "active" ]; then
            echo "::error title=autofill-watcher::watcher is '$OUT' — paid formations will NOT auto-file"
            exit 1
          fi

      - name: Say so when nothing was checked
        if: steps.creds.outcome != 'success'
        run: |
          {
            echo "### :warning: Lambda health check did not run"
            echo
            echo "No AWS credentials on this repo, so no function was probed."
            echo "A green tick here does **not** mean the Lambdas are healthy."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::AWS credentials missing — no Lambda was probed"
          exit 1

      - name: Check Vercel app
        if: always()
        run: |
          STATUS=$(curl -sf -o /dev/null -w '%{http_code}' \
            'https://company-formation-questionnaire.vercel.app/' || echo "000")
          echo "Vercel app: HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Vercel app returned $STATUS"
            exit 1
          fi
