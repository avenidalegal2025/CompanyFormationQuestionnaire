name: Docgen Regression

# Fast, secret-free regression net for document generation, run on every push/PR:
#
#  1. Toggle coverage — fails if any questionnaire toggle the form collects is
#     IGNORED by the generated agreement (the "dead toggle" class: nonsolicitation,
#     confidentiality, incapacity/heirs, transfer-to-relatives have all shipped
#     this way). Generates A/B per toggle and asserts the document changes.
#  2. Document snapshots — golden text snapshots of representative variants;
#     fails on ANY unreviewed change to generated output (wording, numbering,
#     a clause appearing/disappearing). Update with `--update` and review the
#     diff under tests/__snapshots__/docgen/.
#
# Both use committed fixtures under scripts/fixtures/ — no AWS/secrets needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: Docgen regression (toggles + snapshots)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: No invented answers at render time
        # `value={field.value ?? "Yes"}` paints an answer the form never stores:
        # the customer agrees with what they see, saves nothing, and every
        # consumer testing `=== "Yes"` takes the other branch. This shipped as
        # an LLC Operating Agreement with no Managers designated (2026-09-17).
        # Defaults belong in defaultFormValues, where they are actually saved.
        run: npx tsx scripts/test-display-defaults.ts
      - name: No pre-selected answers
        # Every agreement question starts empty and must be answered before
        # Continue. A pre-selected option is shown but never saved, so the
        # document silently uses a different default (fixed 2026-09-17).
        run: npx tsx scripts/test-required-answers.ts
      - name: Answer fidelity (votes, thresholds, dates)
        # The document must repeat the customer's answer: both sentences of
        # LLC 5.1 / Corp 4.5, the voting percentages, and the effective date on
        # the days whose ordinal or year used to come out wrong.
        run: npx tsx scripts/test-answer-fidelity.ts
      - name: Airtable column guard
        # Airtable rejects the whole record on one unknown column name, which
        # loses the formation silently. Checked against a committed snapshot of
        # the Formations table — no credentials needed.
        run: npx tsx scripts/test-airtable-columns.ts
      - name: SS-4 translation routing
        # The questionnaire is Spanish; the SS-4 goes to the IRS in English. A
        # single unaccented Spanish noun used to slip through the language sniff
        # and print "RESTAURANTE" on the principal-activity line. Company names
        # and addresses must NOT be translated. Offline — AWS Translate stubbed.
        run: python3 scripts/test-ss4-translation.py
      - name: Lambda deploy manifest is complete
        # A new lambda-functions/*.py with no manifest entry would never
        # deploy and nobody would notice -- which is how the membership
        # registry ended up 38 lines behind main. Offline, no AWS needed.
        run: python3 scripts/test-lambda-manifest.py
      - name: Toggle-coverage guard
        run: npx tsx scripts/audit-toggle-coverage.ts
      - name: Document snapshot regression
        run: npx tsx scripts/test-docgen-snapshots.ts
      - name: Variant-matrix content + structure sweep
        # 2 entities x 6 owner-counts x 4 voting profiles x 10 toggle-presets =
        # 480, fully decoupled so every entity gets every voting profile at every
        # owner count, including 5 single-feature presets (NS-only / RoFR-only /
        # DT-only / Heirs-only / Divorce-only) that close pair-combo gaps the
        # combinatorial presets coupled. Structural audit + content assertions
        # per variant. ~2m30s.
        run: npx tsx scripts/verify-variant-matrix.ts
      - name: Numeric-value rendering sweep
        # The matrix uses fixture-default numerics (threshold=75, duration=2).
        # This sweep fixes the topology and varies threshold ∈ {51,67,75,99} and
        # NC duration ∈ {1,2,3,5} = 32 variants. Catches "renders the wrong
        # value" + "stale value leaked" regressions. ~25s.
        run: npx tsx scripts/verify-numeric-values.ts
